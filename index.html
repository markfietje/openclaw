<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw for macOS</title>
<meta name="description" content="One-line installer for OpenClaw on macOS with Apple Container.">
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #57534e;
    --accent: #c2410c;
    --accent-bg: #fff7ed;
    --border: #e7e5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09;
      --fg: #fafaf9;
      --muted: #a8a29e;
      --accent: #fb923c;
      --accent-bg: #1c1917;
      --border: #292524;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
    text-align: center;
  }
  h1 {
    font-size: 2.5rem;
    line-height: 1.15;
    margin: 0 0 0.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .lede {
    color: var(--muted);
    font-size: 1.125rem;
    margin: 0 0 2.5rem;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    align-items: center;
  }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 0.875rem 1.5rem;
    border-radius: 10px;
    font-weight: 500;
    font-size: 1rem;
    min-width: 240px;
  }
  a.btn:hover { filter: brightness(1.08); }
  a.secondary {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: 0.9375rem;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    background: var(--accent-bg);
    border: 1px solid var(--border);
    padding: 0.125rem 0.375rem;
    border-radius: 4px;
    font-size: 0.875rem;
  }
  footer {
    margin-top: 4rem;
    color: var(--muted);
    font-size: 0.8125rem;
  }
</style>
</head>
<body>
<main>
  <h1>OpenClaw</h1>
  <p class="lede">Run your own AI assistant on your Mac.<br>Apple Silicon · macOS 26 · ~3 minutes.</p>

  <div class="actions">
    <a class="btn" href="./guide.html">Step-by-step install guide</a>
    <a class="secondary" href="./install" download>Download installer (one line)</a>
  </div>

  <footer>
    <p>Quick command for Terminal:</p>
    <p><code>curl -fsSL https://markfietje.github.io/openclaw/install | bash</code></p>
  </footer>
</main>
</body>
</html>
